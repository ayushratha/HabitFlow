{% extends 'base.html' %}
{% block title %}404 — Page Not Found | HabitFlow{% endblock %}
{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;">
  <div style="max-width: 480px;">
    <div style="font-size: 4rem; font-weight: 800; color: var(--primary); letter-spacing: -0.05em; line-height: 1; margin-bottom: 12px;">404</div>
    <h2 style="margin-bottom: 8px;">Page not found</h2>
    <p class="text-muted" style="margin-bottom: 24px;">The page you are looking for doesn't exist or has moved.</p>
    <a href="{{ url_for('dashboard.index') if user else url_for('main.index') }}" class="btn btn-primary">
      Return to Safety
    </a>
  </div>
</div>
{% endblock %}
